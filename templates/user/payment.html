<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - CartCommerce</title>
    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-container">

    <div class="payment-card">
        <div class="auth-header">
            <div class="mb-3">
                <a href="/" class="brand-logo-custom">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="CartCommerce" class="brand-logo-img">
                </a>
            </div>
            <h1>Complete Payment</h1>
            <p>Your order is ready for secure checkout with Razorpay.</p>
        </div>

        <div style="background: var(--surface-alt); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 2rem; text-align: left;">
            <div class="d-flex justify-between align-center mb-2">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Razorpay Order ID:</span>
                <strong style="font-size: 0.9rem; font-family: monospace;">{{ order_id }}</strong>
            </div>
            <div class="d-flex justify-between align-center mb-2">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Payment Gateway:</span>
                <strong style="color: #0284c7;"><i class="fa-solid fa-shield-check"></i> Razorpay Secure</strong>
            </div>
            <hr style="margin: 0.75rem 0;">
            <div class="d-flex justify-between align-center">
                <span style="font-weight: 700; font-size: 1.05rem;">Total Payable:</span>
                <span class="price-tag" style="font-size: 1.5rem; color: var(--primary);">₹{{ "%.2f"|format(amount|float) }}</span>
            </div>
        </div>

        <button id="rzp-button" class="btn btn-primary btn-block btn-lg">
            <i class="fa-solid fa-lock"></i> Pay ₹{{ "%.2f"|format(amount|float) }} with Razorpay
        </button>

        <div class="mt-3">
            <a href="/user/cart" class="btn btn-secondary btn-block">
                <i class="fa-solid fa-arrow-left"></i> Cancel and Return to Cart
            </a>
        </div>

        <div class="text-center mt-3" style="color: var(--text-muted); font-size: 0.8rem;">
            <i class="fa-solid fa-shield-halved" style="color: var(--success);"></i> 256-bit SSL Encrypted & PCI-DSS Compliant
        </div>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    var options = {
        "key": "{{ key_id }}",
        "amount": "{{ (amount * 100)|int }}", // in paise
        "currency": "INR",
        "name": "CartCommerce",
        "description": "Order Payment",
        "order_id": "{{ order_id }}",
        "handler": function (response){
            // Redirect to success route
            window.location.href = "/payment-success?payment_id="
                + encodeURIComponent(response.razorpay_payment_id)
                + "&order_id=" + encodeURIComponent(response.razorpay_order_id);
        },
        "theme": {
            "color": "#4f46e5"
        }
    };

    var rzp = new Razorpay(options);

    document.getElementById('rzp-button').onclick = function(e){
        rzp.open();
        e.preventDefault();
    };
    </script>

</body>
</html>
